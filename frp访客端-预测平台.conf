# ==========================================================
# CFRP 预测平台 —— STCP 访客端配置
#
# 用途：在"外网设备"（家里的电脑、笔记本、其他服务器）上，
#       用 frpc 加载本配置，即可访问实验室内网的预测平台。
#
# 访问方式：本机浏览器打开  http://127.0.0.1:8502
#           （8502 会通过加密隧道转发到实验室机器的 8501）
#
# 前提：外网设备需安装 frpc（0.52.0 及以上）或 FRP 管理器(frpmgr)
# 启动：frpc -c frp访客端-预测平台.conf
#
# ⚠️ secretKey 是访问凭证，请勿外传！只给需要使用的设备。
# ==========================================================

loginFailExit = true
serverAddr = 'frp3.ccszxc.xin'
serverPort = 62898

[auth]
method = 'token'
token = '690787'

[log]
level = 'info'
maxDays = 3

[[visitors]]
name = 'cfrp-portal-visitor'
type = 'stcp'
# 必须与服务端（实验室机器）stcp 代理的 name 一致
serverName = 'wEXGEClx'
# 必须与服务端 secretKey 一致
secretKey = 'db5281986f4bd55c2dff775d9ffe4b9f'
# 访客在本机监听的地址和端口
bindAddr = '127.0.0.1'
bindPort = 8502
transport.useEncryption = true
