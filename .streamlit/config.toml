[server]
# 局域网访问配置
address = "0.0.0.0"
port = 8501

# [保护] 断连会话保留时长（默认120秒）。切换窗口/短暂离开时避免会话被回收，
# 长耗时的特征提取与模型训练不会因为离开一会儿就丢失进程。
disconnectedSessionTTL = 3600

# [性能] 启用 websocket 压缩：降低大表格/大页面传输与重连时的卡顿
enableWebsocketCompression = true

# 性能优化配置
maxUploadSize = 500
maxMessageSize = 500
enableCORS = false
enableXsrfProtection = false

# 启用文件监控，允许代码保存后自动热更新
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

[runner]
# 加快脚本执行
fastReruns = true
enforceSerializableSessionState = false

# 关闭 magic：应用全部显式调用 st.*，无需裸表达式自动显示。
# 关闭后 Streamlit 重建字节码时不再对整个 app.py（1.2MB/28000行）
# 做 ast.parse+改写（实测约 4.6s），服务器冷启动和文件变更后的首次
# 切页显著加速。已用 AppTest 对比验证关闭前后页面输出完全一致。
magicEnabled = false

[client]
# 显示优化
showErrorDetails = false
toolbarMode = "minimal"

[theme]
base = "light"
